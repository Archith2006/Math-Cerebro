<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Math Cerebro</title>
  <meta name="description" content="100 Logic & Math Riddles - Cool, Minimalist Dark Mathematics Puzzle Game.">
  <meta name="theme-color" content="#0a0c10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/animations.css">
</head>

<body>
  <div id="app">
    <!-- SCREEN 1: SPLASH & HOME (Glassy Aesthetic) -->
    <section id="screen-home" class="screen active">
      <!-- Home Top Header with Sound Control -->
      <div class="home-top-bar">
        <div class="glass-mini-tag">MATH CEREBRO</div>
        <button id="btn-toggle-sound" class="glass-icon-btn" title="Toggle Sound" type="button">
          <span id="sound-icon-indicator">🔊</span>
        </button>
      </div>

      <div class="home-content">
        <div class="brand-header">
          <div class="glass-pill-badge">
            <span class="pulse-indicator"></span>
            LOGIC &amp; MATH RIDDLES
          </div>
          <h1 class="brand-title">MATH CEREBRO</h1>
          <p class="brand-subtitle">100 MIND-BENDING PUZZLES</p>
        </div>

        <!-- Glassy Stats Card -->
        <div class="home-stats-card">
          <div class="home-stat-item">
            <span class="home-stat-val" id="stat-solved">0/100</span>
            <span class="home-stat-label">SOLVED</span>
          </div>
          <div class="home-stat-divider"></div>
          <div class="home-stat-item">
            <span class="home-stat-val" id="stat-level">1</span>
            <span class="home-stat-label">CURRENT LEVEL</span>
          </div>
        </div>

        <!-- Glassy Action Buttons -->
        <div class="home-actions">
          <button id="btn-play-continue" class="btn-home-secondary" type="button">
            <span id="btn-play-text">PLAY LEVEL 1</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <polygon points="6 4 19 12 6 20 6 4"></polygon>
            </svg>
          </button>

          <button id="btn-goto-levels" class="btn-home-secondary" type="button">
            <span>SELECT LEVEL</span>
          </button>

          <button id="btn-goto-themes" class="btn-home-secondary" type="button">
            <span>THEME</span>
          </button>
        </div>
      </div>
    </section>

    <!-- SCREEN 2: LEVEL SELECT (Glassy Matrix) -->
    <section id="screen-levels" class="screen">
      <div class="top-bar">
        <button id="btn-back-home" class="glass-icon-btn" title="Back" type="button">‹</button>
        <h2 class="screen-title-clean">LEVELS</h2>
        <div class="glass-counter-badge" id="level-select-solved">0/100</div>
      </div>

      <!-- 100 Levels Grid: 5 Columns × 20 Rows (Pure Minimalist Square Tiles) -->
      <div class="levels-grid-5col" id="levels-grid-container">
        <!-- Rendered via ScreenManager.renderLevelsGrid() -->
      </div>
    </section>

    <!-- SCREEN 3: GAMEPLAY SCREEN (Glassy Interface) -->
    <section id="screen-game" class="screen">
      <!-- Game Top Bar: Glassy pill controls & level indicator -->
      <div class="game-top-bar">
        <button id="btn-back-to-levels" class="glass-icon-btn" title="Back to Levels" type="button">‹</button>
        <div class="game-level-indicator">
          <span class="pulse-indicator-small"></span>
          <h2 class="game-title-clean" id="game-level-num">Level 1</h2>
        </div>
        <button id="btn-skip-level" class="glass-text-btn" title="Skip Level" type="button">SKIP</button>
      </div>

      <!-- Puzzle Card: Large Frosted Glass Card -->
      <div class="puzzle-display-card" id="puzzle-card">
        <div id="puzzle-content-box"></div>
      </div>

      <!-- Game Control Bar: [ Answer  ✕ ]  [ 💡 ]  [ ENTER ] -->
      <div class="game-control-bar">
        <div class="answer-input-box" id="answer-bar">
          <span class="answer-value-text" id="answer-text"></span>
          <button id="btn-clear-answer" class="answer-clear-icon" title="Clear input" type="button">✕</button>
        </div>

        <button id="btn-open-hint" class="btn-hint-icon" title="Hint" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-7 7c0 2.5 1.5 4.5 3 6h8c1.5-1.5 3-3.5 3-6a7 7 0 0 0-7-7z" />
          </svg>
        </button>

        <button id="btn-submit-answer" class="btn-enter-action" type="button">ENTER</button>
      </div>

      <!-- Keypad: 2 Rows × 5 Columns (Glass Numeric Keys) -->
      <div class="keypad-grid-2x5" id="virtual-keypad">
        <button class="key-num" data-key="1" type="button">1</button>
        <button class="key-num" data-key="2" type="button">2</button>
        <button class="key-num" data-key="3" type="button">3</button>
        <button class="key-num" data-key="4" type="button">4</button>
        <button class="key-num" data-key="5" type="button">5</button>
        <button class="key-num" data-key="6" type="button">6</button>
        <button class="key-num" data-key="7" type="button">7</button>
        <button class="key-num" data-key="8" type="button">8</button>
        <button class="key-num" data-key="9" type="button">9</button>
        <button class="key-num" data-key="0" type="button">0</button>
      </div>

      <!-- Level Complete Action Panel (Next Level Button) -->
      <div id="level-complete-panel" class="level-complete-panel hidden">
        <div class="complete-message-badge">
          <span class="complete-check-icon">✓</span>
          <span class="complete-text">SOLVED</span>
        </div>
        <button id="btn-next-level" class="btn-next-level-action" type="button">
          <span>NEXT LEVEL</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- MODAL: HINT DIALOG (Behance Glass Card Style) -->
    <div id="modal-hint" class="modal-overlay">
      <div class="modal-glass-card">
        <div class="modal-glass-header">
          <div class="modal-glass-badge">SOLUTION GUIDE</div>
          <button class="modal-close-glass-btn" id="btn-close-hint" title="Close" type="button">✕</button>
        </div>
        <h3 class="modal-title-clean">LEVEL HINTS</h3>
        <div id="hint-steps-container" style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;"></div>
      </div>
    </div>

    <!-- MODAL: THEME SELECTION (Behance Glass Style) -->
    <div id="modal-themes" class="modal-overlay">
      <div class="modal-glass-card modal-themes-card">
        <div class="modal-glass-header">
          <div class="modal-glass-badge">PALETTE &amp; BACKDROP</div>
          <button class="modal-close-glass-btn" id="btn-close-themes" title="Close" type="button">✕</button>
        </div>
        <h3 class="modal-title-clean">THEMES</h3>
        <p class="modal-subtitle-glass">Select your visual atmosphere</p>
        <div class="themes-scroll-area">
          <div id="themes-grid-container" class="themes-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/data/levels.js"></script>
  <script src="./js/core/audio.js"></script>
  <script src="./js/core/storage.js"></script>
  <script src="./js/core/validator.js"></script>
  <script src="./js/ui/effects.js"></script>
  <script src="./js/ui/keypad.js"></script>
  <script src="./js/ui/puzzleRenderer.js"></script>
  <script src="./js/ui/screenManager.js"></script>
  <script src="./js/data/themes.js"></script>
  <script src="./js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.log('SW registration note:', err);
        });
      });
    }
  </script>
</body>

</html>
