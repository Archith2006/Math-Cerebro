<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg512)"/>
  <circle cx="256" cy="256" r="180" fill="#0f172a" opacity="0.65" filter="url(#shadow)"/>
  
  <text x="256" y="260" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="190" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">?</text>
  
  <circle cx="150" cy="150" r="42" fill="url(#glow512)"/>
  <text x="150" y="153" font-family="'Outfit', system-ui, sans-serif" font-weight="bold" font-size="52" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">+</text>
  
  <circle cx="362" cy="150" r="42" fill="#10b981"/>
  <text x="362" y="153" font-family="'Outfit', system-ui, sans-serif" font-weight="bold" font-size="52" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">×</text>

  <circle cx="362" cy="362" r="42" fill="url(#glow512)"/>
  <text x="362" y="365" font-family="'Outfit', system-ui, sans-serif" font-weight="bold" font-size="52" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">=</text>

  <circle cx="150" cy="362" r="42" fill="#8b5cf6"/>
  <text x="150" y="365" font-family="'Outfit', system-ui, sans-serif" font-weight="bold" font-size="52" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">÷</text>
