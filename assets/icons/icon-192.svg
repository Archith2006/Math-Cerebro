<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <circle cx="96" cy="96" r="68" fill="#0f172a" opacity="0.6"/>
  <!-- Question mark / Math combo symbol -->
  <text x="96" y="98" font-family="sans-serif" font-weight="900" font-size="74" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">?</text>
  <!-- Mini math symbols -->
  <circle cx="56" cy="56" r="16" fill="url(#glow)"/>
  <text x="56" y="58" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">+</text>
  
  <circle cx="136" cy="56" r="16" fill="#10b981"/>
  <text x="136" y="58" font-family="sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">×</text>

  <circle cx="136" cy="136" r="16" fill="url(#glow)"/>
  <text x="136" y="137" font-family="sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">=</text>

  <circle cx="56" cy="136" r="16" fill="#8b5cf6"/>
  <text x="56" y="136" font-family="sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">÷</text>
</svg>
